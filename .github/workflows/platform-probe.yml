name: Platform probe

on:
  pull_request:
    paths: ['platform_probe/**', 'core/lib/**', 'tool/android-probe.py', 'tool/tablet-story-picker.py', 'tool/sdk.json', '.github/workflows/platform-probe.yml']

permissions:
  contents: read

jobs:
  windows:
    runs-on: windows-latest
    timeout-minutes: 30
    env:
      FLUTTER_SUPPRESS_ANALYTICS: 'true'
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
      - name: Set up pinned Flutter
        shell: pwsh
        run: |
          $sdk = Get-Content -Raw tool/sdk.json | ConvertFrom-Json
          $directory = Join-Path $env:RUNNER_TEMP 'flutter'
          git -c core.longpaths=true clone --depth 1 --branch $sdk.flutter https://github.com/flutter/flutter.git $directory
          if ($LASTEXITCODE -or (git -C $directory rev-parse HEAD) -ne $sdk.flutterCommit) {
              throw 'Flutter checkout mismatch.'
          }
          Join-Path $directory 'bin' | Out-File $env:GITHUB_PATH -Append -Encoding utf8
      - name: Build Windows probe
        working-directory: platform_probe
        shell: pwsh
        run: |
          flutter pub get --enforce-lockfile
          if ($LASTEXITCODE) { exit $LASTEXITCODE }
          flutter analyze --no-pub
          if ($LASTEXITCODE) { exit $LASTEXITCODE }
          flutter build windows --release --no-pub
          if ($LASTEXITCODE) { exit $LASTEXITCODE }
          $source = 'build/windows/x64/runner/Release'
          $evidence = '../build/windows-probe'
          New-Item -ItemType Directory -Force $evidence | Out-Null
          Copy-Item LICENSE.flutter "$source/LICENSE.flutter"
          Get-ChildItem $source -Recurse -File | ForEach-Object {
              [pscustomobject]@{
                  path = [IO.Path]::GetRelativePath((Resolve-Path $source), $_.FullName)
                  sha256 = (Get-FileHash -LiteralPath $_.FullName).Hash
              }
          } | ConvertTo-Json | Set-Content "$evidence/inventory.json"
          Compress-Archive -Path "$source/*" -DestinationPath "$evidence/windows-probe.zip"
          (Get-FileHash "$evidence/windows-probe.zip").Hash | Set-Content "$evidence/sha256.txt"
      - name: Preserve Windows package
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7
        with:
          name: windows-platform-probe
          path: build/windows-probe/
  android-build:
    runs-on: ubuntu-24.04
    timeout-minutes: 35
    env:
      FLUTTER_SUPPRESS_ANALYTICS: 'true'
      DART_SUPPRESS_ANALYTICS: 'true'
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          ref: ${{ github.event.pull_request.head.sha }}
      - name: Set up pinned Flutter
        shell: bash
        run: |
          version=$(jq -r .flutter tool/sdk.json)
          revision=$(jq -r .flutterCommit tool/sdk.json)
          git clone --depth 1 --branch "$version" https://github.com/flutter/flutter.git "$RUNNER_TEMP/flutter"
          test "$(git -C "$RUNNER_TEMP/flutter" rev-parse HEAD)" = "$revision"
          echo "$RUNNER_TEMP/flutter/bin" >> "$GITHUB_PATH"
      - name: Build Android probe and inventory APK
        working-directory: platform_probe
        shell: bash
        run: |
          export JAVA_HOME="$JAVA_HOME_17_X64"
          export PATH="$JAVA_HOME/bin:$PATH"
          flutter --version
          flutter pub get --enforce-lockfile
          flutter analyze --no-pub
          flutter build apk --release --split-per-abi --target-platform android-x64,android-arm64 --no-pub
          mkdir -p ../build/{android-probe,android-arm64-probe}
          cp build/app/outputs/flutter-apk/app-x86_64-release.apk ../build/android-probe/app-release.apk
          cp build/app/outputs/flutter-apk/app-arm64-v8a-release.apk ../build/android-arm64-probe/
          android/gradlew -p android :app:dependencies --configuration releaseRuntimeClasspath --console=plain > ../build/android-probe/gradle-runtime-dependencies.txt
          cd ../build/android-probe
          sha256sum app-release.apk > sha256.txt
          unzip -l app-release.apk > apk-inventory.txt
          unzip -p app-release.apk assets/flutter_assets/NOTICES.Z > flutter-notices.z
          cd ../android-arm64-probe
          apk=app-arm64-v8a-release.apk
          sha256sum "$apk" > sha256.txt
          unzip -l "$apk" > apk-inventory.txt
          unzip -p "$apk" assets/flutter_assets/NOTICES.Z > flutter-notices.z
          unzip -Z1 "$apk" | awk -F/ '$1 == "lib" && $3 != "" {print $2}' | sort -u > native-abis.txt
          test "$(cat native-abis.txt)" = arm64-v8a
          cp ../android-probe/gradle-runtime-dependencies.txt .
      - name: Preserve the Android APK and inventory
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7
        with:
          name: android-platform-probe
          path: build/android-probe/
      - name: Preserve the ARM64 APK and inventory
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7
        with:
          name: android-arm64-platform-probe
          path: build/android-arm64-probe/
      - name: Build ARM64 story picker for the physical tablet
        working-directory: platform_probe
        shell: bash
        env:
          ORG_GRADLE_PROJECT_kronikasStoryPickerProbe: 'true'
        run: |
          export JAVA_HOME="$JAVA_HOME_17_X64"
          export PATH="$JAVA_HOME/bin:$PATH"
          flutter build apk --release --split-per-abi --target-platform android-arm64 --target tool/story_picker_walkthrough.dart --no-pub
          mkdir -p ../build/android-arm64-story-picker
          cp build/app/outputs/flutter-apk/app-arm64-v8a-release.apk ../build/android-arm64-story-picker/story-picker.apk
          cd ../build/android-arm64-story-picker
          git rev-parse HEAD > source-commit.txt
          sha256sum story-picker.apk > sha256.txt
          unzip -l story-picker.apk > apk-inventory.txt
          unzip -p story-picker.apk assets/flutter_assets/NOTICES.Z > flutter-notices.z
      - name: Preserve the ARM64 story picker
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7
        with:
          name: android-arm64-story-picker
          path: build/android-arm64-story-picker/
  android-ui:
    needs: android-build
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8
        with:
          name: android-platform-probe
          path: build/android-probe/
      - name: Check save and reopen on Android emulator
        shell: bash
        run: |
          set -o pipefail
          (cd build/android-probe && sha256sum --check sha256.txt)
          image='system-images;android-35;google_apis;x86_64'
          tools="$ANDROID_HOME/cmdline-tools/latest/bin"
          if [[ ! -x "$tools/sdkmanager" ]]; then
            tools=$(dirname "$(find "$ANDROID_HOME/cmdline-tools" -type f -name sdkmanager | sort -V | tail -n 1)")
          fi
          "$tools/sdkmanager" --install emulator platform-tools "$image"
          export PATH="$ANDROID_HOME/platform-tools:$PATH"
          sudo apt-get update -qq
          sudo apt-get install -y --no-install-recommends libpulse0
          export ANDROID_USER_HOME="$RUNNER_TEMP/kronikas-android"
          export ANDROID_AVD_HOME="$ANDROID_USER_HOME/avd"
          mkdir -p "$ANDROID_AVD_HOME"
          "$ANDROID_HOME/emulator/emulator" -version > build/android-probe/emulator-version.txt 2>&1
          echo no | "$tools/avdmanager" create avd --name kronikas-probe --package "$image" --force
          "$ANDROID_HOME/emulator/emulator" -list-avds | grep -Fx kronikas-probe
          sudo chmod a+rw /dev/kvm
          emulator_args=(-avd kronikas-probe -no-window -no-audio -no-boot-anim -no-snapshot -gpu swiftshader_indirect)
          "$ANDROID_HOME/emulator/emulator" "${emulator_args[@]}" > build/android-probe/emulator.log 2>&1 &
          emulator_pid=$!
          trap 'kill "$emulator_pid" 2>/dev/null || true' EXIT
          for attempt in {1..60}; do
            if ! kill -0 "$emulator_pid"; then
              cat build/android-probe/emulator.log
              exit 1
            fi
            if adb get-state 2>/dev/null | grep -Fxq device; then break; fi
            sleep 3
          done
          adb get-state | grep -Fx device
          timeout 180 bash -c 'until [[ $(adb shell getprop sys.boot_completed | tr -d "\r") == 1 ]]; do sleep 3; done'
          adb shell input keyevent 82
          adb install build/android-probe/app-release.apk
          python3 tool/android-probe.py | tee build/android-probe/ui-steps.txt
      - name: Preserve Android UI evidence
        if: always()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7
        with:
          name: android-ui-evidence
          path: |
            build/android-probe/sha256.txt
            build/android-probe/emulator-version.txt
            build/android-probe/emulator.log
            build/android-probe/ui-steps.txt
