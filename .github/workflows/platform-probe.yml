name: Platform probe

on:
  pull_request:
    types: [opened, synchronize, reopened, ready_for_review, converted_to_draft]
    paths: ['platform_probe/**', 'core/lib/**', 'tool/android-probe.py', 'tool/windows-probe.ps1', 'tool/windows-probe-accessible.cs', 'tool/android-ci-build.sh', 'tool/android_failure_evidence.py', 'tool/tablet-story-picker.py', 'tool/sdk.json', '.github/workflows/platform-probe.yml']

permissions:
  contents: read

concurrency:
  group: platform-probe-${{ github.event.pull_request.number }}
  cancel-in-progress: true

jobs:
  windows:
    if: ${{ !github.event.pull_request.draft }}
    runs-on: windows-latest
    timeout-minutes: 30
    env:
      FLUTTER_SUPPRESS_ANALYTICS: 'true'
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          ref: ${{ github.event.pull_request.head.sha }}
      - name: Set up pinned Flutter
        shell: pwsh
        run: |
          $sdk = Get-Content -Raw tool/sdk.json | ConvertFrom-Json
          $directory = Join-Path $env:RUNNER_TEMP 'flutter'
          git -c core.longpaths=true clone --depth 1 --branch $sdk.flutter https://github.com/flutter/flutter.git $directory
          if ($LASTEXITCODE -or (git -C $directory rev-parse HEAD) -ne $sdk.flutterCommit) {
              throw 'Flutter checkout mismatch.'
          }
          Join-Path $directory 'bin' | Out-File $env:GITHUB_PATH -Append -Encoding utf8
      - name: Build Windows probe
        working-directory: platform_probe
        shell: pwsh
        run: |
          flutter pub get --enforce-lockfile
          if ($LASTEXITCODE) { exit $LASTEXITCODE }
          flutter analyze --no-pub
          if ($LASTEXITCODE) { exit $LASTEXITCODE }
          flutter build windows --release --no-pub
          if ($LASTEXITCODE) { exit $LASTEXITCODE }
          $source = 'build/windows/x64/runner/Release'
          $evidence = '../build/windows-probe'
          New-Item -ItemType Directory -Force $evidence | Out-Null
          Copy-Item LICENSE.flutter "$source/LICENSE.flutter"
          Get-ChildItem $source -Recurse -File | ForEach-Object {
              [pscustomobject]@{
                  path = [IO.Path]::GetRelativePath((Resolve-Path $source), $_.FullName)
                  sha256 = (Get-FileHash -LiteralPath $_.FullName).Hash
              }
          } | ConvertTo-Json | Set-Content "$evidence/inventory.json"
          Compress-Archive -Path "$source/*" -DestinationPath "$evidence/windows-probe.zip"
          (Get-FileHash "$evidence/windows-probe.zip").Hash | Set-Content "$evidence/sha256.txt"
      - name: Preserve Windows package
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7
        with:
          name: windows-platform-probe
          path: build/windows-probe/
      - name: Verify packaged Windows x64 app through Windows accessibility
        shell: powershell
        run: .\tool\windows-probe.ps1 -PackageDirectory build/windows-probe -EvidenceDirectory build/windows-ui-evidence
      - name: Preserve Windows UI evidence
        if: always()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7
        with:
          name: windows-ui-evidence
          path: build/windows-ui-evidence/
  android-build:
    if: ${{ !github.event.pull_request.draft }}
    runs-on: ubuntu-24.04
    timeout-minutes: 35
    env:
      FLUTTER_SUPPRESS_ANALYTICS: 'true'
      DART_SUPPRESS_ANALYTICS: 'true'
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          ref: ${{ github.event.pull_request.head.sha }}
      - name: Set up pinned Flutter
        shell: bash
        run: |
          version=$(jq -r .flutter tool/sdk.json)
          revision=$(jq -r .flutterCommit tool/sdk.json)
          git clone --depth 1 --branch "$version" https://github.com/flutter/flutter.git "$RUNNER_TEMP/flutter"
          test "$(git -C "$RUNNER_TEMP/flutter" rev-parse HEAD)" = "$revision"
          echo "$RUNNER_TEMP/flutter/bin" >> "$GITHUB_PATH"
      - name: Cache Gradle dependencies
        uses: actions/cache@0057852bfaa89a56745cba8c7296529d2fc39830 # v4
        with:
          path: |
            ~/.gradle/caches
            ~/.gradle/wrapper
          key: android-gradle-v1-${{ runner.os }}-${{ runner.arch }}-${{ hashFiles('tool/sdk.json', 'platform_probe/android/**/*.gradle.kts', 'platform_probe/android/gradle.properties', 'platform_probe/android/gradle/wrapper/gradle-wrapper.properties', 'platform_probe/pubspec.lock') }}
      - name: Build Android probe and inventory APK
        working-directory: platform_probe
        shell: bash
        run: |
          export JAVA_HOME="$JAVA_HOME_17_X64"
          export PATH="$JAVA_HOME/bin:$PATH"
          flutter --version
          flutter pub get --enforce-lockfile
          flutter analyze --no-pub
          bash ../tool/android-ci-build.sh --release --split-per-abi --target-platform android-arm64 --no-pub
          destination="$PWD/../build/android-arm64-probe"
          mkdir -p "$destination"
          apk=app-arm64-v8a-release.apk
          cp "build/app/outputs/flutter-apk/$apk" "$destination/"
          android/gradlew -p android :app:dependencies --configuration releaseRuntimeClasspath --console=plain > "$destination/gradle-runtime-dependencies.txt"
          cd "$destination"
          sha256sum "$apk" > sha256.txt
          unzip -l "$apk" > apk-inventory.txt
          unzip -p "$apk" assets/flutter_assets/NOTICES.Z > flutter-notices.z
          unzip -Z1 "$apk" | awk -F/ '$1 == "lib" && $3 != "" {print $2}' | sort -u > native-abis.txt
          test "$(cat native-abis.txt)" = arm64-v8a
      - name: Preserve the ARM64 APK and inventory
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7
        with:
          name: android-arm64-platform-probe
          path: build/android-arm64-probe/
      - name: Build ARM64 story picker
        working-directory: platform_probe
        shell: bash
        env:
          ORG_GRADLE_PROJECT_kronikasStoryPickerProbe: 'true'
        run: |
          export JAVA_HOME="$JAVA_HOME_17_X64"
          export PATH="$JAVA_HOME/bin:$PATH"
          bash ../tool/android-ci-build.sh --release --split-per-abi --target-platform android-arm64 --target tool/story_picker_walkthrough.dart --no-pub
          destination="../build/android-arm64-story-picker"
          mkdir -p "$destination"
          cp build/app/outputs/flutter-apk/app-arm64-v8a-release.apk "$destination/story-picker.apk"
          cd "$destination"
          git rev-parse HEAD > source-commit.txt
          sha256sum story-picker.apk > sha256.txt
          unzip -l story-picker.apk > apk-inventory.txt
          unzip -p story-picker.apk assets/flutter_assets/NOTICES.Z > flutter-notices.z
      - name: Preserve the ARM64 story picker
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7
        with:
          name: android-arm64-story-picker
          path: build/android-arm64-story-picker/
  android-ui:
    if: ${{ !github.event.pull_request.draft }}
    permissions:
      contents: read
      actions: read
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          ref: ${{ github.event.pull_request.head.sha }}
      - name: Cache the Android emulator and system image
        uses: actions/cache@0057852bfaa89a56745cba8c7296529d2fc39830 # v4
        with:
          path: |
            /usr/local/lib/android/sdk/emulator
            /usr/local/lib/android/sdk/system-images/android-35/google_apis/x86_64
          key: android-emulator-api35-google-apis-x64-v2-${{ runner.os }}-${{ runner.arch }}
      - name: Run ARM64 E2E on Android emulator
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -o pipefail
          setup_started=$SECONDS
          artifacts="$PWD/build/android-e2e/artifacts"
          evidence="$PWD/build/android-e2e/evidence"
          mkdir -p "$evidence"
          image='system-images;android-35;google_apis;x86_64'
          tools="$ANDROID_HOME/cmdline-tools/latest/bin"
          if [[ ! -x "$tools/sdkmanager" ]]; then
            tools=$(dirname "$(find "$ANDROID_HOME/cmdline-tools" -type f -name sdkmanager | sort -V | tail -n 1)")
          fi
          "$tools/sdkmanager" --install emulator platform-tools "$image"
          export PATH="$ANDROID_HOME/platform-tools:$PATH"
          if ! ldconfig -p > "$evidence/ldconfig.txt" || ! grep -q 'libpulse.so.0' "$evidence/ldconfig.txt"; then
            sudo apt-get update -qq
            sudo apt-get install -y --no-install-recommends libpulse0
          fi
          export ANDROID_USER_HOME="$RUNNER_TEMP/kronikas-android"
          export ANDROID_AVD_HOME="$ANDROID_USER_HOME/avd"
          mkdir -p "$ANDROID_AVD_HOME"
          "$ANDROID_HOME/emulator/emulator" -version > "$evidence/emulator-version.txt" 2>&1
          echo no | "$tools/avdmanager" create avd --name kronikas-probe --package "$image" --force
          "$ANDROID_HOME/emulator/emulator" -list-avds | grep -Fx kronikas-probe
          sudo chmod a+rw /dev/kvm
          emulator_args=(-avd kronikas-probe -port 5554 -no-window -no-audio -no-boot-anim -no-snapshot -gpu swiftshader_indirect)
          "$ANDROID_HOME/emulator/emulator" "${emulator_args[@]}" > "$evidence/emulator.log" 2>&1 &
          emulator_pid=$!
          trap 'kill "$emulator_pid" 2>/dev/null || true' EXIT
          export ANDROID_SERIAL=emulator-5554
          for attempt in {1..60}; do
            if ! kill -0 "$emulator_pid"; then
              cat "$evidence/emulator.log"
              exit 1
            fi
            if adb get-state 2>/dev/null | grep -Fxq device; then break; fi
            sleep 3
          done
          adb get-state | grep -Fx device
          timeout 180 bash -c 'until [[ $(adb shell getprop sys.boot_completed | tr -d "\r") == 1 ]]; do sleep 3; done'
          adb shell input keyevent 82
          adb shell getprop ro.product.cpu.abilist | tr -d '\r' | tee "$evidence/device-abis.txt"
          adb shell getprop ro.dalvik.vm.native.bridge | tr -d '\r' > "$evidence/native-bridge.txt"
          if ! grep -Eq '(^|,)arm64-v8a(,|$)' "$evidence/device-abis.txt"; then
            echo "::error::The configured Android image cannot run ARM64 APKs."
            exit 1
          fi

          echo "Emulator preparation and boot: $((SECONDS - setup_started))s"
          # APKs are produced by the parallel build job. On a UI-only retry
          # GitHub can serve the same commit-pinned artifacts from that run.
          wait_started=$SECONDS
          deadline=$((SECONDS + 480))
          ready=false
          while (( SECONDS < deadline )); do
            build_result=$(gh run view "$GITHUB_RUN_ID" --repo "$GITHUB_REPOSITORY" --json jobs \
              --jq '.jobs[] | select(.name == "android-build") | .conclusion')
            case "$build_result" in
              success) ready=true; break ;;
              failure|cancelled|timed_out|skipped)
                echo "::error::Android build ended with $build_result."
                exit 1
                ;;
            esac
            sleep 5
          done
          if [[ "$ready" != true ]]; then
            echo "::error::Android build did not finish within the artifact wait budget."
            exit 1
          fi
          gh run download "$GITHUB_RUN_ID" --repo "$GITHUB_REPOSITORY" --pattern 'android-arm64-*' --dir "$artifacts"
          echo "Wait for build and artifact download: $((SECONDS - wait_started))s"
          test_started=$SECONDS

          commit=$(git rev-parse HEAD)
          storage=hu.akihabarai.kronikas_platform_probe
          picker=hu.akihabarai.kronikas_story_picker_probe
          probe="$artifacts/android-arm64-platform-probe"
          picker_artifact="$artifacts/android-arm64-story-picker"
          arm64="$evidence/arm64"
          mkdir -p "$arm64"
          (cd "$probe" && sha256sum --check sha256.txt)
          cp "$probe/sha256.txt" "$arm64/storage-sha256.txt"
          adb install "$probe/app-arm64-v8a-release.apk"
          adb shell dumpsys package "$storage" | tr -d '\r' > "$arm64/storage-package.txt"
          grep -Eq '^[[:space:]]*primaryCpuAbi=arm64-v8a$' "$arm64/storage-package.txt"
          python3 -X utf8 tool/android-probe.py --evidence "$arm64/storage-failure" | tee "$arm64/storage-steps.txt"
          if ! adb shell pidof "$storage" >/dev/null; then
            adb uninstall "$storage"
          else
            echo 'Storage test app is still running.'
            exit 1
          fi
          python3 -X utf8 tool/tablet-story-picker.py "$picker_artifact" --commit "$commit" --device "$ANDROID_SERIAL" --evidence "$arm64/story-picker" --conflict-smoke
          if ! adb shell pidof "$picker" >/dev/null; then
            adb uninstall "$picker"
          else
            echo 'Story picker is still running.'
            exit 1
          fi
          echo "ARM64 install and smoke tests: $((SECONDS - test_started))s"
      - name: Preserve Android UI evidence
        if: always()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7
        with:
          name: android-ui-evidence
          path: build/android-e2e/evidence/
