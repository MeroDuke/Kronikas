name: Flutter checks

on:
  push:
    paths: ['platform_probe/**', 'core/lib/**', 'tool/sdk.json', '.github/workflows/flutter-checks.yml']

permissions:
  contents: read

concurrency:
  group: flutter-checks-${{ github.ref }}
  cancel-in-progress: true

jobs:
  flutter-checks:
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    env:
      FLUTTER_SUPPRESS_ANALYTICS: 'true'
      DART_SUPPRESS_ANALYTICS: 'true'
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
      - name: Cache Flutter test SDK and pub packages
        uses: actions/cache@0057852bfaa89a56745cba8c7296529d2fc39830 # v4
        with:
          path: |
            ${{ runner.temp }}/flutter
            ~/.pub-cache
          key: flutter-checks-v1-${{ runner.os }}-${{ runner.arch }}-${{ hashFiles('tool/sdk.json', 'platform_probe/pubspec.lock') }}
      - name: Set up pinned Flutter
        run: |
          version=$(jq -r .flutter tool/sdk.json)
          revision=$(jq -r .flutterCommit tool/sdk.json)
          if [[ ! -d "$RUNNER_TEMP/flutter/.git" ]]; then
            git clone --depth 1 --branch "$version" https://github.com/flutter/flutter.git "$RUNNER_TEMP/flutter"
          fi
          test "$(git -C "$RUNNER_TEMP/flutter" rev-parse HEAD)" = "$revision"
          echo "$RUNNER_TEMP/flutter/bin" >> "$GITHUB_PATH"
      - name: Analyze and test Flutter
        working-directory: platform_probe
        shell: bash
        run: |
          mkdir -p ../build/flutter-checks
          flutter pub get --enforce-lockfile
          flutter analyze --no-pub | tee ../build/flutter-checks/analysis.log
          flutter test --no-pub --machine | tee ../build/flutter-checks/widgets.jsonl
      - name: Preserve Flutter reports
        if: always()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7
        with:
          name: flutter-check-results
          path: build/flutter-checks/
